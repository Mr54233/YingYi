name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore StrmAssistant/StrmAssistant.csproj

      - name: Build (Release)
        run: dotnet build StrmAssistant/StrmAssistant.csproj -c Release --no-restore

      - name: Show output
        shell: pwsh
        run: |
          Get-ChildItem artifacts
          Get-FileHash artifacts/YingYi.dll -Algorithm MD5 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YingYi
          path: artifacts/YingYi.dll
          if-no-files-found: error
